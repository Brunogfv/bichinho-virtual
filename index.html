<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bichinhos Virtuais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        /* ── RESET & BASE ─────────────────────────────────── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #f5efe6;
            --card: #fffdf8;
            --border: #e8ddd0;
            --shadow: rgba(180, 150, 120, .12);
            --text: #3d2c1e;
            --muted: #9e8878;
            --accent: #ff8c42;
            --tick: 400ms;
        }

        body {
            background: var(--bg);
            font-family: 'Nunito', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 40px;
        }

        /* ── HEADER ───────────────────────────────────────── */
        .app-header {
            text-align: center;
            margin-bottom: 18px;
        }

        .app-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--text);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .app-sub {
            font-size: 13px;
            color: var(--muted);
        }

        /* ── TELA PRINCIPAL (aparelho) ────────────────────── */
        .device {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 32px;
            box-shadow: 0 8px 32px var(--shadow), 0 2px 0 var(--border);
            overflow: hidden;
            position: relative;
        }

        /* ── SCREEN ───────────────────────────────────────── */
        .screen {
            background: #1a1a2e;
            margin: 20px 20px 0;
            border-radius: 16px;
            border: 3px solid #0d0d1a;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, .5);
            position: relative;
            overflow: hidden;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .02) 1px, transparent 1px, transparent 3px);
            z-index: 10;
        }

        .screen-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: 13px;
            background: radial-gradient(ellipse at 50% 0%, var(--pet-glow, rgba(100, 200, 100, .08)) 0%, transparent 70%);
            z-index: 9;
            transition: background 1s;
        }

        /* Pet display inside screen */
        .pet-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 12px 10px;
            position: relative;
            z-index: 11;
        }

        .pet-sprite {
            image-rendering: pixelated;
            transition: transform .1s;
            filter: drop-shadow(0 4px 12px var(--pet-glow, rgba(100, 200, 100, .4)));
        }

        .pet-sprite svg {
            display: block;
        }

        .pet-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: var(--pet-color, #6bcb77);
            letter-spacing: 1px;
        }

        .pet-stage-badge {
            font-size: 11px;
            color: #555577;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
        }

        /* Status bars on screen */
        .status-bars {
            width: 100%;
            padding: 0 14px 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            position: relative;
            z-index: 11;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bar-icon {
            font-size: 11px;
            width: 16px;
            text-align: center;
        }

        .bar-track {
            flex: 1;
            height: 5px;
            background: #2a2a50;
            border-radius: 3px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .5s ease;
        }

        .bar-val {
            font-size: 9px;
            color: #555577;
            width: 22px;
            text-align: right;
            font-family: monospace;
        }

        /* Floating notifications */
        .notif-area {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }

        .notif {
            background: rgba(255, 255, 255, .12);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 11px;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 6.5px;
            white-space: nowrap;
            animation: notifIn .3s ease, notifOut .4s ease 2.2s forwards;
            line-height: 1.4;
        }

        .notif.danger {
            border-color: rgba(255, 100, 100, .4);
            color: #ff9999;
        }

        .notif.warn {
            border-color: rgba(255, 200, 100, .4);
            color: #ffcc88;
        }

        .notif.good {
            border-color: rgba(100, 220, 100, .4);
            color: #88ee99;
        }

        .notif.evolve {
            border-color: rgba(200, 180, 255, .5);
            color: #ccbbff;
            font-size: 7.5px;
        }

        @keyframes notifIn {
            from {
                opacity: 0;
                transform: translateY(-6px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @keyframes notifOut {
            to {
                opacity: 0;
                transform: translateY(-8px)
            }
        }

        /* Sleep ZZZ overlay */
        .zzz {
            position: absolute;
            top: 10px;
            right: 14px;
            z-index: 15;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #8080cc;
            pointer-events: none;
            animation: floatZzz 2s ease-in-out infinite;
        }

        @keyframes floatZzz {
            0% {
                opacity: 0;
                transform: translateY(0)
            }

            30% {
                opacity: 1
            }

            100% {
                opacity: 0;
                transform: translateY(-20px)
            }
        }

        /* Sparkles overlay */
        .sparkles {
            position: absolute;
            inset: 0;
            z-index: 14;
            pointer-events: none;
            display: none;
        }

        .sparkles.active {
            display: block;
        }

        .sparkle {
            position: absolute;
            font-size: 14px;
            animation: sparkleAnim 1s ease forwards;
        }

        @keyframes sparkleAnim {
            0% {
                opacity: 0;
                transform: scale(0) rotate(0deg)
            }

            50% {
                opacity: 1;
                transform: scale(1.2) rotate(20deg)
            }

            100% {
                opacity: 0;
                transform: scale(.5) rotate(40deg) translateY(-20px)
            }
        }

        /* ── CONTROLES ────────────────────────────────────── */
        .controls {
            padding: 16px 20px 20px;
        }

        .controls-label {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            color: var(--muted);
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 12px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-action {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 10px 4px;
            cursor: pointer;
            transition: all .15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-family: 'Press Start 2P', monospace;
            position: relative;
            overflow: hidden;
        }

        .btn-action:hover:not(:disabled) {
            border-color: var(--pet-color, #6bcb77);
            background: var(--card);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn-action:active:not(:disabled) {
            transform: translateY(0) scale(.97);
        }

        .btn-action:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-icon {
            font-size: 20px;
        }

        .btn-label {
            font-size: 5.5px;
            color: var(--muted);
        }

        .btn-cooldown {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--pet-color, #6bcb77);
            opacity: .5;
            transition: width .1s linear;
            border-radius: 0 0 12px 12px;
        }

        /* ── SELEÇÃO DE BICHINHO ──────────────────────────── */
        .pet-select-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 20, 10, .85);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .pet-select-overlay.hidden {
            display: none;
        }

        .select-box {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 24px 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
        }

        .select-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-align: center;
            margin-bottom: 4px;
            color: var(--text);
        }

        .select-sub {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            margin-bottom: 18px;
        }

        .pet-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        @media(min-width:360px) {
            .pet-options {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .pet-option {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px 6px;
            cursor: pointer;
            transition: all .15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .pet-option:hover {
            border-color: var(--oc);
            transform: translateY(-2px);
        }

        .pet-option.selected {
            border-color: var(--oc);
            background: var(--card);
            box-shadow: 0 0 0 1px var(--oc);
        }

        .pet-option svg {
            image-rendering: pixelated;
        }

        .pet-option-name {
            font-family: 'Press Start 2P', monospace;
            font-size: 5px;
            color: var(--muted);
        }

        .pet-option.selected .pet-option-name {
            color: var(--oc);
        }

        .name-input-wrap {
            margin-bottom: 14px;
        }

        .name-input-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            display: block;
        }

        .name-input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: var(--text);
            outline: none;
            transition: border-color .2s;
        }

        .name-input:focus {
            border-color: var(--accent);
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), #ff6b1a);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #fff;
            letter-spacing: 1px;
            transition: all .15s;
            box-shadow: 0 4px 16px rgba(255, 140, 66, .35);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 140, 66, .45);
        }

        /* ── TELA DE MORTE ────────────────────────────────── */
        .death-overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: rgba(10, 8, 20, .92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 13px;
            text-align: center;
            padding: 20px;
        }

        .death-overlay.hidden {
            display: none;
        }

        .death-skull {
            font-size: 36px;
            margin-bottom: 4px;
        }

        .death-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            color: #cc8888;
        }

        .death-age {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .btn-restart {
            margin-top: 12px;
            padding: 8px 16px;
            background: rgba(255, 100, 100, .2);
            border: 1px solid rgba(255, 100, 100, .4);
            border-radius: 8px;
            color: #ff9999;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            transition: all .15s;
        }

        .btn-restart:hover {
            background: rgba(255, 100, 100, .3);
        }

        /* ── BOTTOM META ──────────────────────────────────── */
        .meta-bar {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            width: 100%;
            max-width: 380px;
        }

        .age-label {
            font-size: 12px;
            color: var(--muted);
        }

        .age-val {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--text);
        }

        .records-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 11px;
            color: var(--muted);
            transition: all .15s;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
        }

        .records-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        /* ── RECORDES ─────────────────────────────────────── */
        .records-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 20, 10, .85);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .records-overlay.hidden {
            display: none;
        }

        .records-box {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 24px 20px;
            width: 100%;
            max-width: 380px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .records-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            text-align: center;
            margin-bottom: 16px;
        }

        .record-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .record-rank {
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--muted);
            width: 20px;
        }

        .record-info {
            flex: 1;
        }

        .record-name {
            font-weight: 700;
        }

        .record-age {
            font-size: 11px;
            color: var(--muted);
        }

        .records-empty {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            padding: 20px 0;
        }

        .btn-close-records {
            margin-top: 16px;
            width: 100%;
            padding: 10px;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            color: var(--muted);
            transition: all .15s;
        }

        .btn-close-records:hover {
            border-color: var(--text);
            color: var(--text);
        }

        /* ── ANIMAÇÕES DO SPRITE ──────────────────────────── */
        @keyframes petBounce {

            0%,
            100% {
                transform: translateY(0) scale(1)
            }

            50% {
                transform: translateY(-8px) scale(1.05)
            }
        }

        @keyframes petSway {

            0%,
            100% {
                transform: rotate(-4deg)
            }

            50% {
                transform: rotate(4deg)
            }
        }

        @keyframes petPulse {

            0%,
            100% {
                transform: scale(1)
            }

            50% {
                transform: scale(.93)
            }
        }

        @keyframes petWiggle {

            0%,
            100% {
                transform: rotate(0)
            }

            25% {
                transform: rotate(-8deg)
            }

            75% {
                transform: rotate(8deg)
            }
        }

        @keyframes petShake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-4px)
            }

            75% {
                transform: translateX(4px)
            }
        }

        .pet-sprite.anim-bounce {
            animation: petBounce .7s ease-in-out infinite;
        }

        .pet-sprite.anim-sway {
            animation: petSway 2s ease-in-out infinite;
        }

        .pet-sprite.anim-pulse {
            animation: petPulse 1.5s ease-in-out infinite;
        }

        .pet-sprite.anim-wiggle {
            animation: petWiggle .5s ease-in-out infinite;
        }

        .pet-sprite.anim-shake {
            animation: petShake .3s ease-in-out 3;
        }
    </style>
</head>

<body>

    <div class="app-header">
        <div class="app-title">BICHINHOS VIRTUAIS</div>
        <div class="app-sub">cuide bem do seu bichinho! 🐾</div>
    </div>

    <!-- DEVICE -->
    <div class="device" id="device">
        <div class="screen" id="screen">
            <div class="screen-glow" id="screenGlow"></div>
            <div class="notif-area" id="notifArea"></div>
            <div class="zzz" id="zzzEl" style="display:none">z<span style="font-size:10px">z</span><span
                    style="font-size:7px">z</span></div>
            <div class="sparkles" id="sparkles"></div>

            <div class="pet-area">
                <div class="pet-sprite" id="petSprite"></div>
                <div class="pet-name" id="petName">---</div>
                <div class="pet-stage-badge" id="petStageBadge">---</div>
            </div>

            <div class="status-bars" id="statusBars">
                <div class="bar-row">
                    <span class="bar-icon">🍖</span>
                    <div class="bar-track">
                        <div class="bar-fill" id="barHunger" style="width:50%;background:#ff8c42"></div>
                    </div>
                    <span class="bar-val" id="valHunger">50</span>
                </div>
                <div class="bar-row">
                    <span class="bar-icon">💖</span>
                    <div class="bar-track">
                        <div class="bar-fill" id="barHappy" style="width:80%;background:#f48fb1"></div>
                    </div>
                    <span class="bar-val" id="valHappy">80</span>
                </div>
                <div class="bar-row">
                    <span class="bar-icon">⚡</span>
                    <div class="bar-track">
                        <div class="bar-fill" id="barEnergy" style="width:80%;background:#5bc4f5"></div>
                    </div>
                    <span class="bar-val" id="valEnergy">80</span>
                </div>
                <div class="bar-row">
                    <span class="bar-icon">🛁</span>
                    <div class="bar-track">
                        <div class="bar-fill" id="barHygiene" style="width:80%;background:#b0c8e8"></div>
                    </div>
                    <span class="bar-val" id="valHygiene">80</span>
                </div>
                <div class="bar-row" style="grid-column:span 2">
                    <span class="bar-icon">❤️</span>
                    <div class="bar-track" style="height:7px">
                        <div class="bar-fill" id="barHealth" style="width:100%;background:#e05050"></div>
                    </div>
                    <span class="bar-val" id="valHealth">100</span>
                </div>
            </div>

            <!-- Tela de morte -->
            <div class="death-overlay hidden" id="deathOverlay">
                <div class="death-skull">💀</div>
                <div class="death-title" id="deathTitle">ADEUS...</div>
                <div class="death-age" id="deathAge"></div>
                <div id="deathSprite" style="margin:8px 0;image-rendering:pixelated;"></div>
                <button class="btn-restart" onclick="showSelectScreen()">✦ NOVO BICHINHO</button>
            </div>
        </div>

        <!-- Botões de controle -->
        <div class="controls">
            <div class="controls-label">— AÇÕES —</div>
            <div class="btn-grid">
                <button class="btn-action" id="btnFeed" onclick="doAction('feed')">
                    <span class="btn-icon">🍖</span>
                    <span class="btn-label">ALIMENTAR</span>
                    <div class="btn-cooldown" id="cdFeed"></div>
                </button>
                <button class="btn-action" id="btnPlay" onclick="doAction('play')">
                    <span class="btn-icon">🎾</span>
                    <span class="btn-label">BRINCAR</span>
                    <div class="btn-cooldown" id="cdPlay"></div>
                </button>
                <button class="btn-action" id="btnSleep" onclick="doAction('sleep')">
                    <span class="btn-icon" id="sleepIcon">💤</span>
                    <span class="btn-label" id="sleepLabel">DORMIR</span>
                    <div class="btn-cooldown" id="cdSleep"></div>
                </button>
                <button class="btn-action" id="btnClean" onclick="doAction('clean')">
                    <span class="btn-icon">🛁</span>
                    <span class="btn-label">LIMPAR</span>
                    <div class="btn-cooldown" id="cdClean"></div>
                </button>
                <button class="btn-action" id="btnHeal" onclick="doAction('heal')">
                    <span class="btn-icon">💊</span>
                    <span class="btn-label">REMEDIAR</span>
                    <div class="btn-cooldown" id="cdHeal"></div>
                </button>
                <button class="btn-action" onclick="showSelectScreen(true)">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-label">NOVO</span>
                </button>
            </div>
        </div>
    </div>

    <!-- META BAR -->
    <div class="meta-bar">
        <div>
            <div class="age-label">Idade</div>
            <div class="age-val" id="ageVal">0min</div>
        </div>
        <button class="records-btn" onclick="showRecords()">🏆 Recordes</button>
    </div>

    <!-- SELEÇÃO DE BICHINHO -->

        function getSprite(kind, state) {
            const def = SPRITES[kind];
            if (!def) return '';
            const fn = def[state] || def.happy;
            return fn ? fn() : '';
        }

        // ══════════════════════════════════════════════════════════
        // PET CLASS
        // ══════════════════════════════════════════════════════════
        const STAGE_THRESHOLDS = { egg: 0, baby: 0.08, adult: 0.5, old: 2.0 };
        const STAGE_LABELS = { egg: 'Ovo', baby: 'Filhote', adult: 'Adulto', old: 'Velhinho' };
        const DECAY = { hunger: 1.2, happiness: 0.8, energy: 0.6, hygiene: 0.4 };

        class Pet {
            constructor(cfg = {}) {
                this.id = cfg.id || Date.now().toString();
                this.kind = cfg.kind || 'florinho';
                this.name = cfg.name || PET_TYPES[this.kind]?.name || 'Bichinho';
                this.stage = cfg.stage || 'egg';
                this.isAlive = cfg.isAlive !== undefined ? cfg.isAlive : true;
                this.isSleeping = cfg.isSleeping || false;
                this.isEating = false;
                this.isPlaying = false;
                this.hunger = cfg.hunger ?? 20;
                this.happiness = cfg.happiness ?? 80;
                this.energy = cfg.energy ?? 80;
                this.hygiene = cfg.hygiene ?? 80;
                this.health = cfg.health ?? 100;
                this.ageMinutes = cfg.ageMinutes || 0;
                this.bornAt = cfg.bornAt || Date.now();
                this.lastTick = cfg.lastTick || Date.now();
                this.stats = cfg.stats || { feeds: 0, plays: 0, sleeps: 0, heals: 0 };
                this._cds = {};
                this._cdTime = 4000;
            }

            get ageHours() { return this.ageMinutes / 60; }
            get kindInfo() { return PET_TYPES[this.kind] || PET_TYPES.florinho; }
            get stageLabel() { return STAGE_LABELS[this.stage] || this.stage; }

            get emotionalState() {
                if (!this.isAlive) return 'dead';
                if (this.isSleeping) return 'sleeping';
                if (this.isEating) return 'eating';
                if (this.isPlaying) return 'playing';
                if (this.health < 30) return 'sick';
                if (this.hunger > 70) return 'hungry';
                if (this.happiness > 75 && this.health > 75) return 'happy2';
                if (this.happiness < 30) return 'angry';
                return 'happy';
            }

            tick(deltaMs) {
                if (!this.isAlive) return [];
                const dm = deltaMs / 60000;
                this.ageMinutes += dm;
                const events = [];

                if (this.isSleeping) {
                    this.energy = Math.min(100, this.energy + dm * 8);
                    this.happiness = Math.min(100, this.happiness + dm * 1);
                    if (this.energy >= 100) { this.isSleeping = false; events.push({ type: 'wakeup', msg: `${this.name} acordou! 🌅`, cls: 'good' }); }
                    this._checkStage(events);
                    return events;
                }

                this.hunger = Math.min(100, this.hunger + DECAY.hunger * dm);
                this.happiness = Math.max(0, this.happiness - DECAY.happiness * dm);
                this.energy = Math.max(0, this.energy - DECAY.energy * dm);
                this.hygiene = Math.max(0, this.hygiene - DECAY.hygiene * dm);

                if (this.hunger > 80 || this.hygiene < 20) this.health = Math.max(0, this.health - dm * 1.5);
                else if (this.hunger < 40 && this.hygiene > 50 && this.health < 100) this.health = Math.min(100, this.health + dm * .4);
                if (this.hunger > 60) this.happiness = Math.max(0, this.happiness - dm * .5);
                if (this.health < 50) this.happiness = Math.max(0, this.happiness - dm * .3);

                if (this.energy <= 0) { this.isSleeping = true; events.push({ type: 'sleep', msg: `${this.name} caiu no sono! 😴`, cls: 'warn' }); }
                if (this.health <= 0) { this.isAlive = false; events.push({ type: 'death', msg: '' }); return events; }

                if (this.hunger > 75) events.push({ type: 'alert', msg: `${this.name} está com MUITA fome! 🍖`, cls: 'danger' });
                else if (this.hunger > 55) events.push({ type: 'alert', msg: `${this.name} está com fome...`, cls: 'warn' });
                if (this.happiness < 20) events.push({ type: 'alert', msg: `${this.name} está muito triste! 😢`, cls: 'warn' });
                if (this.energy < 20 && !this.isSleeping) events.push({ type: 'alert', msg: `${this.name} está exausto! ⚡`, cls: 'warn' });
                if (this.health < 40) events.push({ type: 'alert', msg: `${this.name} precisa de remédio! 💊`, cls: 'danger' });

                this._checkStage(events);
                return events;
            }

            _checkStage(events) {
                const h = this.ageHours;
                const ns = h >= STAGE_THRESHOLDS.old ? 'old' : h >= STAGE_THRESHOLDS.adult ? 'adult' : h >= STAGE_THRESHOLDS.baby ? 'baby' : 'egg';
                if (ns !== this.stage) {
                    this.stage = ns;
                    events.push({ type: 'evolve', msg: `${this.name} evoluiu para ${STAGE_LABELS[ns]}! ✨`, cls: 'evolve' });
                }
            }

            _canAct(k) { return (Date.now() - (this._cds[k] || 0)) >= this._cdTime; }
            _cd(k) { this._cds[k] = Date.now(); }
            cdLeft(k) { return Math.max(0, this._cdTime - (Date.now() - (this._cds[k] || 0))); }

            feed() { if (!this._canAct('feed')) return { ok: false, msg: 'Aguarde...' }; if (!this.isAlive || this.isSleeping) return { ok: false, msg: this.isSleeping ? `${this.name} está dormindo!` : '❌' }; if (this.hunger <= 5) return { ok: false, msg: `${this.name} já está satisfeito!` }; this.hunger = Math.max(0, this.hunger - 30); this.happiness = Math.min(100, this.happiness + 10); this.isEating = true; this.stats.feeds++; setTimeout(() => { this.isEating = false; }, 2000); this._cd('feed'); return { ok: true, msg: `${this.name} comeu! 🍖` }; }
            play() { if (!this._canAct('play')) return { ok: false, msg: 'Aguarde...' }; if (!this.isAlive || this.isSleeping) return { ok: false, msg: this.isSleeping ? `${this.name} está dormindo!` : '❌' }; if (this.energy < 15) return { ok: false, msg: `${this.name} está sem energia!` }; this.happiness = Math.min(100, this.happiness + 20); this.energy = Math.max(0, this.energy - 12); this.hunger = Math.min(100, this.hunger + 5); this.isPlaying = true; this.stats.plays++; setTimeout(() => { this.isPlaying = false; }, 2000); this._cd('play'); return { ok: true, msg: `${this.name} brincou! 🎾` }; }
            sleep() { if (!this.isAlive) return { ok: false }; if (this.isSleeping) { this.isSleeping = false; return { ok: true, msg: `${this.name} acordou! 🌅` }; } if (this.energy >= 90) return { ok: false, msg: `${this.name} não está com sono!` }; this.isSleeping = true; this.stats.sleeps++; return { ok: true, msg: `${this.name} foi dormir! 💤` }; }
            clean() { if (!this._canAct('clean')) return { ok: false, msg: 'Aguarde...' }; if (!this.isAlive) return { ok: false }; this.hygiene = Math.min(100, this.hygiene + 35); this.happiness = Math.min(100, this.happiness + 5); this._cd('clean'); return { ok: true, msg: `${this.name} está limpinho! 🛁` }; }
            heal() { if (!this._canAct('heal')) return { ok: false, msg: 'Aguarde...' }; if (!this.isAlive) return { ok: false }; if (this.health >= 90) return { ok: false, msg: `${this.name} está saudável!` }; this.health = Math.min(100, this.health + 30); this.happiness = Math.min(100, this.happiness + 5); this.stats.heals++; this._cd('heal'); return { ok: true, msg: `${this.name} tomou o remédio! 💊` }; }

            toJSON() { return { id: this.id, kind: this.kind, name: this.name, stage: this.stage, isAlive: this.isAlive, isSleeping: this.isSleeping, hunger: this.hunger, happiness: this.happiness, energy: this.energy, hygiene: this.hygiene, health: this.health, ageMinutes: this.ageMinutes, bornAt: this.bornAt, lastTick: Date.now(), stats: this.stats }; }

            static fromJSON(d) {
                const p = new Pet(d);
                const off = Math.min(Date.now() - (d.lastTick || Date.now()), 4 * 60 * 60 * 1000);
                if (off > 5000 && p.isAlive) p.tick(off);
                return p;
            }
        }

        // ══════════════════════════════════════════════════════════
        // STORAGE
        // ══════════════════════════════════════════════════════════
        const SAVE_KEY = 'bichinho_v1', REC_KEY = 'bichinho_recs';
        function savePet(p) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(p.toJSON())); } catch (e) { } }
        function loadPet() { try { const r = localStorage.getItem(SAVE_KEY); return r ? Pet.fromJSON(JSON.parse(r)) : null; } catch (e) { return null; } }
        function deleteSave() { localStorage.removeItem(SAVE_KEY); }
        function saveRecord(p) { try { const rs = loadRecords(); rs.push({ name: p.name, kind: p.kind, age: Math.round(p.ageMinutes), stage: p.stageLabel, ts: Date.now(), stats: p.stats }); rs.sort((a, b) => b.age - a.age); rs.splice(10); localStorage.setItem(REC_KEY, JSON.stringify(rs)); } catch (e) { } }
        function loadRecords() { try { return JSON.parse(localStorage.getItem(REC_KEY) || '[]'); } catch (e) { return []; } }

        // ══════════════════════════════════════════════════════════
        // AUDIO (Web Audio API — sons 8-bit)
        // ══════════════════════════════════════════════════════════
        let audioCtx = null;
        function getAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
        function beep(freq = 440, dur = 0.15, type = 'square', vol = 0.12) {
            try {
                const ctx = getAudio(), o = ctx.createOscillator(), g = ctx.createGain();
                o.connect(g); g.connect(ctx.destination);
                o.type = type; o.frequency.value = freq;
                g.gain.setValueAtTime(vol, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                o.start(); o.stop(ctx.currentTime + dur);
            } catch (e) { }
        }
        function sfxFeed() { beep(523, .08, 'square'); setTimeout(() => beep(659, .12, 'square'), 90); }
        function sfxPlay() { beep(784, .07, 'square'); setTimeout(() => beep(880, .07, 'square'), 80); setTimeout(() => beep(1047, .15, 'square'), 160); }
        function sfxSleep() { beep(330, .2, 'sine', .08); }
        function sfxHeal() { beep(440, .08, 'sine'); setTimeout(() => beep(550, .08, 'sine'), 100); setTimeout(() => beep(660, .2, 'sine'), 200); }
        function sfxEvolve() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18, 'square', .15), i * 120)); }
        function sfxDead() { beep(220, .4, 'sawtooth', .15); setTimeout(() => beep(196, .5, 'sawtooth', .1), 350); }
        function sfxAlert() { beep(440, .06, 'square', .08); setTimeout(() => beep(440, .06, 'square', .08), 150); }
        function sfxNo() { beep(220, .15, 'square', .1); }

        // ══════════════════════════════════════════════════════════
        // GAME STATE
        // ══════════════════════════════════════════════════════════
        let pet = null;
        let gameLoop = null;
        let selectedKind = 'florinho';
        const TICK_MS = 1000;

        // ══════════════════════════════════════════════════════════
        // UI HELPERS
        // ══════════════════════════════════════════════════════════
        function setColor(color, glow) {
            document.documentElement.style.setProperty('--pet-color', color);
            document.documentElement.style.setProperty('--pet-glow', glow);
            document.getElementById('screenGlow').style.background =
                `radial-gradient(ellipse at 50% 10%, ${glow} 0%, transparent 70%)`;
        }

        function updateSprite() {
            const el = document.getElementById('petSprite');
            if (!pet) { el.innerHTML = ''; return; }
            const state = pet.emotionalState;
            // For stages (egg/baby/old) override state sprite with stage-appropriate one
            let spriteKey = state;
            if (state === 'happy' || state === 'happy2') {
                // Show stage sprite when happy
                spriteKey = (pet.stage === 'egg' || pet.stage === 'baby' || pet.stage === 'old') ? pet.stage : state;
            }
            el.innerHTML = getSprite(pet.kind, spriteKey) || getSprite(pet.kind, pet.stage) || '';

            // Animation class
            el.className = 'pet-sprite';
            const animMap = {
                happy: 'anim-bounce', happy2: 'anim-bounce', eating: 'anim-bounce',
                playing: 'anim-wiggle', sleeping: 'anim-sway', sick: 'anim-pulse',
                hungry: 'anim-shake', angry: 'anim-wiggle', dead: ''
            };
            const anim = animMap[state];
            if (anim) el.classList.add(anim);
        }

        function updateBars() {
            if (!pet) return;
            const set = (id, val, color) => {
                document.getElementById(id).style.width = val + '%';
                document.getElementById(id).style.background = color;
            };
            // Hunger bar: red when high (bad), green when low (good)
            const hc = pet.hunger > 70 ? '#ef4444' : pet.hunger > 40 ? '#f97316' : '#6bcb77';
            set('barHunger', 100 - pet.hunger, hc); // invert: full bar = satisfied
            document.getElementById('valHunger').textContent = Math.round(100 - pet.hunger);

            const hpC = pet.happiness < 30 ? '#ef4444' : pet.happiness < 60 ? '#f97316' : '#f48fb1';
            set('barHappy', pet.happiness, hpC);
            document.getElementById('valHappy').textContent = Math.round(pet.happiness);

            const enC = pet.energy < 20 ? '#555577' : pet.energy < 50 ? '#b0c8e8' : '#5bc4f5';
            set('barEnergy', pet.energy, enC);
            document.getElementById('valEnergy').textContent = Math.round(pet.energy);

            const hyC = pet.hygiene < 30 ? '#ef4444' : pet.hygiene < 60 ? '#f97316' : '#b0c8e8';
            set('barHygiene', pet.hygiene, hyC);
            document.getElementById('valHygiene').textContent = Math.round(pet.hygiene);

            const heC = pet.health < 30 ? '#ef4444' : pet.health < 60 ? '#f97316' : '#6bcb77';
            set('barHealth', pet.health, heC);
            document.getElementById('valHealth').textContent = Math.round(pet.health);
        }

        function updateMeta() {
            if (!pet) return;
            const m = Math.round(pet.ageMinutes);
            const txt = m < 60 ? m + 'min' : Math.floor(m / 60) + 'h' + ('0' + Math.round(m % 60)).slice(-2) + 'm';
            document.getElementById('ageVal').textContent = txt;
            document.getElementById('petName').textContent = pet.name.toUpperCase();
            document.getElementById('petStageBadge').textContent = pet.stageLabel + ' · ' + (pet.kindInfo?.type || '');
            document.getElementById('petName').style.color = pet.kindInfo?.color || '#6bcb77';
        }

        function updateSleepBtn() {
            const icon = document.getElementById('sleepIcon');
            const label = document.getElementById('sleepLabel');
            if (pet?.isSleeping) { icon.textContent = '☀️'; label.textContent = 'ACORDAR'; }
            else { icon.textContent = '💤'; label.textContent = 'DORMIR'; }
        }

        function updateCooldowns() {
            if (!pet) return;
            ['feed', 'play', 'clean', 'heal'].forEach(k => {
                const el = document.getElementById('cd' + k.charAt(0).toUpperCase() + k.slice(1));
                if (!el) return;
                const left = pet.cdLeft(k);
                el.style.width = left > 0 ? ((left / pet._cdTime) * 100) + '%' : '0%';
            });
        }

        let lastNotifTime = 0;
        function showNotif(msg, cls = '', dontSpam = false) {
            if (dontSpam) {
                const now = Date.now();
                if (now - lastNotifTime < 3000) return;
                lastNotifTime = now;
            }
            const area = document.getElementById('notifArea');
            const el = document.createElement('div');
            el.className = 'notif ' + (cls || '');
            el.textContent = msg;
            area.appendChild(el);
            setTimeout(() => el.remove(), 2800);
            if (cls === 'danger' || cls === 'warn') sfxAlert();
        }

        function triggerSparkles() {
            const el = document.getElementById('sparkles');
            el.innerHTML = '';
            el.classList.add('active');
            const emojis = ['✨', '⭐', '🌟', '💫', '🎉'];
            for (let i = 0; i < 6; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                s.style.left = (15 + Math.random() * 70) + '%';
                s.style.top = (10 + Math.random() * 70) + '%';
                s.style.animationDelay = (Math.random() * 0.4) + 's';
                el.appendChild(s);
            }
            setTimeout(() => { el.classList.remove('active'); el.innerHTML = ''; }, 1200);
        }

        function handleEvents(events) {
            events.forEach(ev => {
                if (ev.type === 'death') { onDeath(); return; }
                if (ev.type === 'evolve') { showNotif(ev.msg, 'evolve'); sfxEvolve(); triggerSparkles(); return; }
                if (ev.type === 'wakeup') { showNotif(ev.msg, 'good'); return; }
                if (ev.type === 'sleep') { showNotif(ev.msg, 'warn'); sfxSleep(); return; }
                if (ev.type === 'alert') showNotif(ev.msg, ev.cls || 'warn', true);
            });
        }

        function onDeath() {
            if (gameLoop) { clearInterval(gameLoop); gameLoop = null; }
            saveRecord(pet);
            deleteSave();
            sfxDead();
            const min = Math.round(pet.ageMinutes);
            const ageStr = min < 60 ? `${min} minutos` : `${Math.floor(min / 60)}h ${Math.round(min % 60)}min`;
            document.getElementById('deathTitle').textContent = pet.name.toUpperCase() + ' NOS DEIXOU...';
            document.getElementById('deathAge').textContent = `Viveu por ${ageStr} · ${pet.stageLabel}`;
            document.getElementById('deathSprite').innerHTML = getSprite(pet.kind, 'dead') || '';
            document.getElementById('deathOverlay').classList.remove('hidden');
            updateSprite();
        }

        // ══════════════════════════════════════════════════════════
        // ACTIONS
        // ══════════════════════════════════════════════════════════
        function doAction(action) {
            if (!pet || !pet.isAlive) return;
            let result;
            if (action === 'feed') { result = pet.feed(); if (result.ok) { sfxFeed(); triggerSparkles(); } }
            if (action === 'play') { result = pet.play(); if (result.ok) { sfxPlay(); triggerSparkles(); } }
            if (action === 'sleep') { result = pet.sleep(); if (result.ok) { updateSleepBtn(); if (pet.isSleeping) sfxSleep(); } }
            if (action === 'clean') { result = pet.clean(); if (result.ok) sfxFeed(); }
            if (action === 'heal') { result = pet.heal(); if (result.ok) { sfxHeal(); triggerSparkles(); } }
            if (result) { showNotif(result.msg, result.ok ? 'good' : ''); }
            updateZzz();
            savePet(pet);
        }

        function updateZzz() {
            const z = document.getElementById('zzzEl');
            z.style.display = pet?.isSleeping ? 'block' : 'none';
        }

        // ══════════════════════════════════════════════════════════
        // GAME LOOP
        // ══════════════════════════════════════════════════════════
        let lastTickTime = Date.now();
        function startLoop() {
            if (gameLoop) clearInterval(gameLoop);
            lastTickTime = Date.now();
            gameLoop = setInterval(() => {
                if (!pet || !pet.isAlive) return;
                const now = Date.now();
                const delta = now - lastTickTime;
                lastTickTime = now;
                const events = pet.tick(delta);
                handleEvents(events);
                updateSprite();
                updateBars();
                updateMeta();
                updateSleepBtn();
                updateCooldowns();
                if (Math.round(pet.ageMinutes * 10) % 50 === 0) savePet(pet);
            }, TICK_MS);
        }

        // ══════════════════════════════════════════════════════════
        // SELECT SCREEN
        // ══════════════════════════════════════════════════════════
        function buildSelectScreen() {
            const container = document.getElementById('petOptions');
            container.innerHTML = '';
            Object.entries(PET_TYPES).forEach(([k, info]) => {
                const div = document.createElement('div');
                div.className = 'pet-option' + (k === selectedKind ? ' selected' : '');
                div.style.setProperty('--oc', info.color);
                div.innerHTML = `${getSprite(k, 'happy') || getSprite(k, 'baby') || ''}
      <div class="pet-option-name">${info.name.toUpperCase()}</div>`;
                div.addEventListener('click', () => {
                    selectedKind = k;
                    document.querySelectorAll('.pet-option').forEach(o => o.classList.remove('selected'));
                    div.classList.add('selected');
                    document.getElementById('nameInput').placeholder = info.name;
                });
                container.appendChild(div);
            });
            document.getElementById('nameInput').value = '';
            document.getElementById('nameInput').placeholder = PET_TYPES[selectedKind].name;
        }

        function showSelectScreen(force = false) {
            if (!force && loadPet()) { continueGame(); return; }
            buildSelectScreen();
            document.getElementById('selectOverlay').classList.remove('hidden');
        }

        function startGame() {
            const rawName = document.getElementById('nameInput').value.trim();
            const name = rawName || PET_TYPES[selectedKind]?.name || 'Bichinho';
            pet = new Pet({ kind: selectedKind, name });
            document.getElementById('selectOverlay').classList.add('hidden');
            document.getElementById('deathOverlay').classList.add('hidden');
            setColor(pet.kindInfo.color, pet.kindInfo.glow);
            updateSprite(); updateBars(); updateMeta(); updateSleepBtn(); updateZzz();
            savePet(pet);
            startLoop();
            showNotif(`${name} nasceu! 🥚`, 'good');
            sfxEvolve();
        }

        function continueGame() {
            pet = loadPet();
            if (!pet) { showSelectScreen(true); return; }
            document.getElementById('selectOverlay').classList.add('hidden');
            document.getElementById('deathOverlay').classList.add('hidden');
            setColor(pet.kindInfo.color, pet.kindInfo.glow);
            updateSprite(); updateBars(); updateMeta(); updateSleepBtn(); updateZzz();
            startLoop();
            if (!pet.isAlive) onDeath();
            else showNotif(`Bem-vindo de volta, ${pet.name}!`, 'good');
        }

        // ══════════════════════════════════════════════════════════
        // RECORDS
        // ══════════════════════════════════════════════════════════
        function showRecords() {
            const records = loadRecords();
            const list = document.getElementById('recordsList');
            if (records.length === 0) {
                list.innerHTML = '<div class="records-empty">Nenhum recorde ainda.<br>Cuide bem do seu bichinho!</div>';
            } else {
                list.innerHTML = records.map((r, i) => {
                    const m = r.age; const txt = m < 60 ? `${m}min` : `${Math.floor(m / 60)}h${Math.round(m % 60)}m`;
                    const info = PET_TYPES[r.kind] || PET_TYPES.florinho;
                    return `<div class="record-row">
        <span class="record-rank">#${i + 1}</span>
        <span style="font-size:16px">${info.icon}</span>
        <div class="record-info">
          <div class="record-name">${r.name} <span style="color:var(--muted);font-size:11px">(${r.stage})</span></div>
          <div class="record-age">Viveu ${txt} · ${info.name}</div>
        </div>
      </div>`;
                }).join('');
            }
            document.getElementById('recordsOverlay').classList.remove('hidden');
        }
        function closeRecords() { document.getElementById('recordsOverlay').classList.add('hidden'); }

        // ══════════════════════════════════════════════════════════
        // INIT
        // ══════════════════════════════════════════════════════════
        window.addEventListener('load', () => {
            const saved = loadPet();
            if (saved) { continueGame(); }
            else { showSelectScreen(true); }
        });

        window.addEventListener('beforeunload', () => { if (pet) savePet(pet); });


        // ══════════════════════════════════════════════════════════
        // FASE 4 AVANÇADA — MINIGAME "PEGA O ITEM"
        // ══════════════════════════════════════════════════════════
        let miniActive = false, miniItems = [], miniScore = 0;
        let miniTimer = null, miniCountdown = 0, miniAnimFrame = null;

        const MINI_ITEMS = [
            { emoji: '🍎', pts: 2, good: true }, { emoji: '🍕', pts: 3, good: true },
            { emoji: '⭐', pts: 5, good: true }, { emoji: '💎', pts: 8, good: true },
            { emoji: '💩', pts: -3, good: false }, { emoji: '🌩️', pts: -2, good: false },
        ];

        function openMiniGame() {
            if (!pet || !pet.isAlive) { showNotif('Sem bichinho!', ''); return; }
            if (pet.isSleeping) { showNotif(pet.name + ' está dormindo!', ''); return; }
            if (pet.energy < 15) { showNotif(pet.name + ' está sem energia!', 'warn'); return; }
            miniActive = true; miniScore = 0; miniItems = []; miniCountdown = 15;

            let ov = document.getElementById('miniOverlay');
            if (!ov) { ov = document.createElement('div'); ov.id = 'miniOverlay'; document.body.appendChild(ov); }
            ov.style.cssText = 'position:fixed;inset:0;background:rgba(10,8,20,.94);backdrop-filter:blur(6px);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:20px;';

            ov.innerHTML = `
    <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:#aaa;letter-spacing:1px;margin-bottom:6px;">MINIGAME</div>
    <div style="font-size:13px;color:#666;font-family:monospace;margin-bottom:12px;">Toque nos itens bons! Evite os ruins!</div>
    <div style="display:flex;gap:24px;margin-bottom:10px;font-family:'Press Start 2P',monospace;font-size:8px;">
      <span style="color:#f9e04b;">⭐ <span id="mScore">0</span></span>
      <span style="color:#5bc4f5;">⏱ <span id="mTimer">15</span>s</span>
    </div>
    <div id="mArena" style="width:320px;height:320px;max-width:92vw;background:#13131f;border:2px solid #2a2a50;border-radius:16px;position:relative;overflow:hidden;touch-action:none;cursor:crosshair;box-shadow:inset 0 0 30px rgba(0,0,0,.5);"></div>
    <div style="margin-top:10px;font-size:11px;color:#333;font-family:monospace;">🍎🍕⭐💎 = pontos &nbsp;·&nbsp; 💩🌩️ = menos pontos</div>
    <button onclick="closeMiniGame(true)" style="margin-top:12px;padding:8px 20px;background:rgba(255,80,80,.15);border:1px solid rgba(255,80,80,.3);border-radius:8px;color:#ff9999;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:7px;">SAIR</button>
  `;

            const arena = document.getElementById('mArena');
            arena.addEventListener('click', onMiniClick);
            arena.addEventListener('touchstart', onMiniTouch, { passive: true });

            miniTimer = setInterval(() => {
                miniCountdown--;
                const el = document.getElementById('mTimer');
                if (el) el.textContent = miniCountdown;
                if (miniCountdown <= 0) { clearInterval(miniTimer); endMiniGame(); }
            }, 1000);
            spawnMiniItems();
        }

        function spawnMiniItems() {
            if (!miniActive) return;
            const arena = document.getElementById('mArena');
            if (!arena) return;
            const W = arena.offsetWidth, H = arena.offsetHeight;
            const tmpl = MINI_ITEMS[Math.floor(Math.random() * MINI_ITEMS.length)];
            const item = {
                ...tmpl, id: 'mi' + Date.now() + Math.random(),
                x: 20 + Math.random() * (W - 60), y: 20 + Math.random() * (H - 60),
                vx: (Math.random() - .5) * 1.6, vy: (Math.random() - .5) * 1.6,
                life: 2800 + Math.random() * 2000
            };
            miniItems.push(item);
            const el = document.createElement('div');
            el.id = item.id; el.dataset.pts = item.pts;
            el.style.cssText = `position:absolute;font-size:26px;left:${item.x}px;top:${item.y}px;cursor:pointer;user-select:none;transition:transform .08s;filter:${item.good ? 'drop-shadow(0 0 5px rgba(255,220,100,.6))' : 'drop-shadow(0 0 5px rgba(255,60,60,.6))'};`;
            el.textContent = item.emoji;
            arena.appendChild(el);
            setTimeout(() => { el.remove(); miniItems = miniItems.filter(i => i.id !== item.id); }, item.life);
            if (!miniAnimFrame) animateMiniItems();
            if (miniActive) setTimeout(spawnMiniItems, 550 + Math.random() * 650);
        }

        function animateMiniItems() {
            if (!miniActive) { miniAnimFrame = null; return; }
            const arena = document.getElementById('mArena');
            if (!arena) { miniAnimFrame = null; return; }
            const W = arena.offsetWidth, H = arena.offsetHeight;
            miniItems.forEach(item => {
                item.x += item.vx; item.y += item.vy;
                if (item.x < 5 || item.x > W - 38) item.vx *= -1;
                if (item.y < 5 || item.y > H - 38) item.vy *= -1;
                const el = document.getElementById(item.id);
                if (el) { el.style.left = item.x + 'px'; el.style.top = item.y + 'px'; }
            });
            miniAnimFrame = requestAnimationFrame(animateMiniItems);
        }

        function onMiniClick(e) {
            const el = e.target.closest('[data-pts]');
            if (el) hitMiniItem(el);
        }
        function onMiniTouch(e) {
            const t = e.touches[0];
            const els = document.elementsFromPoint(t.clientX, t.clientY);
            const el = els.find(x => x.dataset && x.dataset.pts !== undefined);
            if (el) hitMiniItem(el);
        }
        function hitMiniItem(el) {
            const pts = parseInt(el.dataset.pts) || 0;
            miniScore += pts;
            const s = document.getElementById('mScore');
            if (s) s.textContent = Math.max(0, miniScore);
            // Burst label
            const burst = document.createElement('div');
            burst.style.cssText = `position:absolute;left:${el.style.left};top:${el.style.top};font-family:'Press Start 2P',monospace;font-size:10px;pointer-events:none;color:${pts > 0 ? '#f9e04b' : '#ef4444'};z-index:20;animation:burstUp .6s ease forwards;`;
            burst.textContent = (pts > 0 ? '+' : '') + pts;
            el.parentElement && el.parentElement.appendChild(burst);
            setTimeout(() => burst.remove(), 700);
            // SFX
            if (pts > 0) { beep(660, .07, 'square', .12); if (pts >= 5) setTimeout(() => beep(880, .1, 'square', .12), 80); }
            else beep(200, .15, 'sawtooth', .1);
            el.remove();
            miniItems = miniItems.filter(i => i.id !== el.id);
        }

        function endMiniGame() {
            miniActive = false;
            if (miniAnimFrame) { cancelAnimationFrame(miniAnimFrame); miniAnimFrame = null; }
            const ov = document.getElementById('miniOverlay');
            if (!ov) return;
            const gainHappy = Math.min(30, Math.max(0, miniScore * 2));
            const costEnergy = Math.min(20, 8 + Math.max(0, miniScore));
            if (pet && pet.isAlive) {
                pet.happiness = Math.min(100, pet.happiness + gainHappy);
                pet.energy = Math.max(0, pet.energy - costEnergy);
                pet.hunger = Math.min(100, pet.hunger + 6);
                pet.isPlaying = false; savePet(pet); sfxPlay(); triggerSparkles();
            }
            const s = Math.max(0, miniScore);
            const grade = s >= 20 ? 'S' : s >= 12 ? 'A' : s >= 6 ? 'B' : s >= 0 ? 'C' : 'D';
            const gc = { S: '#f9e04b', A: '#6bcb77', B: '#5bc4f5', C: '#b0c8e8', D: '#ef4444' }[grade];
            ov.innerHTML = `
    <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:#aaa;margin-bottom:16px;">RESULTADO</div>
    <div style="font-family:'Press Start 2P',monospace;font-size:52px;color:${gc};text-shadow:0 0 24px ${gc};margin-bottom:10px;">${grade}</div>
    <div style="font-family:'Press Start 2P',monospace;font-size:10px;color:#f9e04b;margin-bottom:6px;">⭐ ${s} pontos</div>
    <div style="font-size:13px;color:#666;margin-bottom:22px;font-family:monospace;">+${gainHappy} felicidade · -${costEnergy} energia</div>
    <button onclick="closeMiniGame(false)" style="padding:10px 26px;background:linear-gradient(135deg,#ff8c42,#ff6b1a);border:none;border-radius:12px;color:#fff;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:1px;">CONTINUAR</button>
    <button onclick="openMiniGame()" style="margin-top:8px;padding:8px 18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#888;cursor:pointer;font-family:'Press Start 2P',monospace;font-size:7px;">JOGAR DE NOVO</button>
  `;
        }

        function closeMiniGame(abrupt = false) {
            miniActive = false; clearInterval(miniTimer);
            if (miniAnimFrame) { cancelAnimationFrame(miniAnimFrame); miniAnimFrame = null; }
            const ov = document.getElementById('miniOverlay');
            if (ov) ov.style.display = 'none';
            if (abrupt && pet) pet.isPlaying = false;
        }

        // Inject minigame button
        (function () {
            const grid = document.querySelector('.btn-grid');
            if (!grid) return;
            const last = grid.lastElementChild;
            const btn = document.createElement('button');
            btn.className = 'btn-action'; btn.onclick = openMiniGame;
            btn.innerHTML = '<span class="btn-icon">🎮</span><span class="btn-label">MINIGAME</span>';
            grid.insertBefore(btn, last);
        })();

        // ══════════════════════════════════════════════════════════
        // FASE 4 — PARTÍCULAS DE CORAÇÃO
        // ══════════════════════════════════════════════════════════
        function spawnHeartParticles() {
            const rect = document.getElementById('petSprite')?.getBoundingClientRect() || { left: window.innerWidth / 2, top: 200, width: 60, height: 60 };
            const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
            const emojis = ['❤️', '🌟', '✨', '💖', '⭐', '🎉'];
            for (let i = 0; i < 7; i++) {
                const p = document.createElement('div');
                const angle = (Math.PI * 2 / 7) * i + Math.random() * .5;
                const dist = 50 + Math.random() * 55;
                const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist - 35;
                p.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;font-size:${13 + Math.random() * 10}px;pointer-events:none;z-index:999;transition:transform ${.55 + Math.random() * .4}s ease,opacity .5s ease ${.35 + Math.random() * .3}s;`;
                p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                document.body.appendChild(p);
                requestAnimationFrame(() => { p.style.transform = `translate(${dx}px,${dy}px) scale(1.2)`; p.style.opacity = '0'; });
                setTimeout(() => p.remove(), 1100);
            }
        }
        const _origSparkles = triggerSparkles;
        window.triggerSparkles = function () { _origSparkles(); spawnHeartParticles(); };

        // ══════════════════════════════════════════════════════════
        // FASE 4 — DIA / NOITE
        // ══════════════════════════════════════════════════════════
        function updateDayNight() {
            const h = new Date().getHours(), screen = document.getElementById('screen');
            if (!screen) return;
            if (h >= 21 || h < 6) screen.style.background = '#0d0d20';
            else if (h >= 18) screen.style.background = '#1a120a';
            else screen.style.background = '#1a1a2e';
        }
        updateDayNight();
        setInterval(updateDayNight, 60000);

        // ══════════════════════════════════════════════════════════
        // FASE 4 — OVO TREMENDO
        // ══════════════════════════════════════════════════════════
        let _eggInterval = null;
        function manageEggAnim() {
            if (!pet || pet.stage !== 'egg') { clearInterval(_eggInterval); _eggInterval = null; return; }
            if (_eggInterval) return;
            _eggInterval = setInterval(() => {
                if (!pet || pet.stage !== 'egg') { clearInterval(_eggInterval); _eggInterval = null; return; }
                const sp = document.getElementById('petSprite');
                if (!sp) return;
                sp.classList.add('anim-shake');
                setTimeout(() => sp.classList.remove('anim-shake'), 500);
            }, 4000);
        }
        const _origUS = updateSprite;
        window.updateSprite = function () { _origUS(); manageEggAnim(); };

        // ══════════════════════════════════════════════════════════
        // FASE 5 — NOTIFICAÇÕES DO BROWSER
        // ══════════════════════════════════════════════════════════
        let notifPerm = 'default', lastBNotif = 0;
        async function requestNotifPermission() {
            if (!('Notification' in window)) return;
            if (Notification.permission === 'granted') { notifPerm = 'granted'; return; }
            if (Notification.permission !== 'denied') notifPerm = await Notification.requestPermission();
        }
        function sendBrowserNotif(title, body) {
            if (notifPerm !== 'granted' || document.visibilityState === 'visible') return;
            if (Date.now() - lastBNotif < 5 * 60 * 1000) return;
            lastBNotif = Date.now();
            try { new Notification(title, { body }); } catch (e) { }
        }
        setInterval(() => {
            if (!pet || !pet.isAlive || document.visibilityState === 'visible') return;
            if (pet.hunger > 75) sendBrowserNotif(pet.name + ' está com fome! 🍖', 'Volte e alimente seu bichinho!');
            else if (pet.health < 30) sendBrowserNotif(pet.name + ' está doente! 💊', 'Ele precisa de remédio urgente!');
            else if (pet.happiness < 20) sendBrowserNotif(pet.name + ' está triste! 😢', 'Brinque com seu bichinho!');
        }, 3 * 60 * 1000);
        (function () {
            const bar = document.querySelector('.meta-bar');
            if (!bar || !('Notification' in window)) return;
            const btn = document.createElement('button');
            btn.className = 'records-btn'; btn.textContent = '🔔 Notifs';
            btn.addEventListener('click', async () => {
                await requestNotifPermission();
                if (notifPerm === 'granted') { btn.textContent = '🔔 ON'; btn.style.color = 'var(--accent)'; showNotif('Notificações ativadas!', 'good'); }
                else showNotif('Permissão negada pelo browser.', '');
            });
            bar.appendChild(btn);
        })();

        // ══════════════════════════════════════════════════════════
        // FASE 5 — PWA MANIFEST DINÂMICO
        // ══════════════════════════════════════════════════════════
        (function () {
            const mf = {
                name: 'Bichinhos Virtuais', short_name: 'Bichinho', display: 'standalone',
                background_color: '#f5efe6', theme_color: '#ff8c42', start_url: '.',
                icons: [{ src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23ff8c42'/><text x='32' y='44' text-anchor='middle' font-size='36'>🐾</text></svg>", sizes: '64x64', type: 'image/svg+xml' }]
            };
            const lnk = document.createElement('link');
            lnk.rel = 'manifest';
            lnk.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/json' }));
            document.head.appendChild(lnk);
            const mt = document.createElement('meta'); mt.name = 'theme-color'; mt.content = '#ff8c42';
            document.head.appendChild(mt);
            const ma = document.createElement('meta'); ma.name = 'apple-mobile-web-app-capable'; ma.content = 'yes';
            document.head.appendChild(ma);
        })();

        // ══════════════════════════════════════════════════════════
        // FASE 5 — RECORDES COM STATS
        // ══════════════════════════════════════════════════════════
        window.showRecords = function () {
            const records = loadRecords();
            const list = document.getElementById('recordsList');
            if (!records.length) {
                list.innerHTML = '<div class="records-empty">Nenhum recorde ainda.<br>Cuide bem do seu bichinho! 🐾</div>';
            } else {
                list.innerHTML = records.map((r, i) => {
                    const m = r.age, txt = m < 60 ? m + 'min' : Math.floor(m / 60) + 'h ' + Math.round(m % 60) + 'm';
                    const info = PET_TYPES[r.kind] || PET_TYPES.florinho;
                    const medal = ['🥇', '🥈', '🥉'][i] || ('#' + (i + 1));
                    const st = r.stats || {};
                    return `<div class="record-row" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <div style="display:flex;align-items:center;gap:8px;width:100%;">
          <span class="record-rank">${medal}</span>
          <span style="font-size:18px">${info.icon}</span>
          <div class="record-info" style="flex:1">
            <div class="record-name" style="color:${info.color}">${r.name}
              <span style="color:var(--muted);font-size:10px;font-weight:400">(${r.stage})</span></div>
            <div class="record-age">Viveu ${txt} · ${info.name}</div>
          </div>
        </div>
        ${st.feeds || st.plays ? `<div style="font-size:10px;color:#777;padding-left:52px;">🍖${st.feeds || 0} &nbsp;🎾${st.plays || 0} &nbsp;💊${st.heals || 0} &nbsp;💤${st.sleeps || 0}</div>` : ''}
      </div>`;
                }).join('');
            }
            document.getElementById('recordsOverlay').classList.remove('hidden');
        };

        // ══════════════════════════════════════════════════════════
        // CSS EXTRA — minigame + health crítico
        // ══════════════════════════════════════════════════════════
        (function () {
            const s = document.createElement('style');
            s.textContent = `
    @keyframes burstUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-38px) scale(.7)}}
    #barHealth.critical{animation:hPulse .8s ease-in-out infinite;}
    @keyframes hPulse{0%,100%{opacity:1}50%{opacity:.35}}
  `;
            document.head.appendChild(s);
        })();
        setInterval(() => {
            const b = document.getElementById('barHealth');
            if (!b || !pet) return;
            pet.health < 30 ? b.classList.add('critical') : b.classList.remove('critical');
        }, 2000);

        document.addEventListener('click', () => requestNotifPermission(), { once: true });

    </script>
</body>

</html>
