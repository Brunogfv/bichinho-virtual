<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bichinhos Virtuais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff8c42">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>

    <div class="app-header">
        <div class="app-title">BICHINHOS VIRTUAIS</div>
        <div class="app-sub">cuide bem do seu bichinho! 🐾</div>
    </div>

    <!-- DEVICE -->
    <div class="device" id="device">
        <div class="screen" id="screen">
            <div class="event-log" id="eventLog"></div>
            <div class="screen-glow" id="screenGlow"></div>
            <div class="notif-area" id="notifArea"></div>
            <div class="zzz" id="zzzEl" style="display:none">z<span style="font-size:10px">z</span><span
                    style="font-size:7px">z</span></div>
            <div class="sparkles" id="sparkles"></div>

            <div class="pet-area">
                <div class="pet-sprite" id="petSprite"></div>
                <div class="pet-name" id="petName">---</div>
                <div class="pet-stage-badge" id="petStageBadge">---</div>
            </div>

            <div class="status-bars" id="statusBars">
                <div class="bar-row">
                    <span class="bar-icon">🍖</span>
                    <div class="bar-track">
                        <div class="bar-fill" id="barHunger" style="width:50%;background:#ff8c42"></div>
                    </div>
                    <span class="bar-val" id="valHunger">50</span>
                </div>
                <div class="bar-row">
                    <span class="bar-icon">💖</span>
                    <div class="bar-track">
                        <div class="bar-fill" id="barHappy" style="width:80%;background:#f48fb1"></div>
                    </div>
                    <span class="bar-val" id="valHappy">80</span>
                </div>
                <div class="bar-row">
                    <span class="bar-icon">⚡</span>
                    <div class="bar-track">
                        <div class="bar-fill" id="barEnergy" style="width:80%;background:#5bc4f5"></div>
                    </div>
                    <span class="bar-val" id="valEnergy">80</span>
                </div>
                <div class="bar-row">
                    <span class="bar-icon">🛁</span>
                    <div class="bar-track">
                        <div class="bar-fill" id="barHygiene" style="width:80%;background:#b0c8e8"></div>
                    </div>
                    <span class="bar-val" id="valHygiene">80</span>
                </div>
                <div class="bar-row" style="grid-column:span 2">
                    <span class="bar-icon">❤️</span>
                    <div class="bar-track" style="height:7px">
                        <div class="bar-fill" id="barHealth" style="width:100%;background:#e05050"></div>
                    </div>
                    <span class="bar-val" id="valHealth">100</span>
                </div>
            </div>

            <!-- Tela de morte -->
            <div class="death-overlay hidden" id="deathOverlay">
                <div class="death-skull">💀</div>
                <div class="death-title" id="deathTitle">ADEUS...</div>
                <div class="death-age" id="deathAge"></div>
                <div id="deathSprite" style="margin:8px 0;image-rendering:pixelated;"></div>
                <button class="btn-restart" onclick="showSelectScreen()">✦ NOVO BICHINHO</button>
            </div>
        </div>

        <!-- Botões de controle -->
        <div class="controls">
            <div class="controls-label">— AÇÕES —</div>
            <div class="btn-grid">
                <button class="btn-action" id="btnFeed" onclick="doAction('feed')">
                    <span class="btn-icon">🍖</span>
                    <span class="btn-label">ALIMENTAR</span>
                    <div class="btn-cooldown" id="cdFeed"></div>
                </button>
                <button class="btn-action" id="btnPlay" onclick="doAction('play')">
                    <span class="btn-icon">🎾</span>
                    <span class="btn-label">BRINCAR</span>
                    <div class="btn-cooldown" id="cdPlay"></div>
                </button>
                <button class="btn-action" id="btnSleep" onclick="doAction('sleep')">
                    <span class="btn-icon" id="sleepIcon">💤</span>
                    <span class="btn-label" id="sleepLabel">DORMIR</span>
                    <div class="btn-cooldown" id="cdSleep"></div>
                </button>
                <button class="btn-action" id="btnClean" onclick="doAction('clean')">
                    <span class="btn-icon">🛁</span>
                    <span class="btn-label">LIMPAR</span>
                    <div class="btn-cooldown" id="cdClean"></div>
                </button>
                <button class="btn-action" id="btnHeal" onclick="doAction('heal')">
                    <span class="btn-icon">💊</span>
                    <span class="btn-label">REMEDIAR</span>
                    <div class="btn-cooldown" id="cdHeal"></div>
                </button>
                <button class="btn-action" onclick="openShop()">
                    <span class="btn-icon">💰</span>
                    <span class="btn-label">LOJA</span>
                </button>
                <button class="btn-action" onclick="showSelectScreen(true)">
                    <span class="btn-icon">🔄</span>
                    <span class="btn-label">NOVO</span>
                </button>
            </div>
        </div>
    </div>

    <!-- META BAR -->
    <div class="meta-bar">
        <div>
            <div class="age-label">Idade</div>
            <div class="age-val" id="ageVal">0min</div>
        </div>
        <button class="records-btn" onclick="showRecords()">🏆 Recordes</button>
    </div>

    <!-- SELEÇÃO DE BICHINHO -->
    <div class="pet-select-overlay" id="selectOverlay">
        <div class="select-box">
            <div class="select-title">NOVO BICHINHO</div>
            <div class="select-sub">Escolha seu companheiro!</div>
            <div class="pet-options" id="petOptions"></div>
            <div class="name-input-wrap">
                <label class="name-input-label">Nome do bichinho:</label>
                <input class="name-input" id="nameInput" type="text" maxlength="12" placeholder="Ex: Brotinho">
            </div>
            <button class="btn-start" onclick="startGame()">▶ COMEÇAR!</button>
        </div>
    </div>

    <!-- RECORDES -->
    <div class="records-overlay hidden" id="recordsOverlay">
        <div class="records-box">
            <div class="records-title">🏆 RECORDES</div>
            <div id="recordsList"></div>
            <button class="btn-close-records" onclick="closeRecords()">FECHAR</button>
        </div>
    </div>

    <!-- LOJA -->
    <div class="shop-overlay hidden" id="shopOverlay">
        <div class="shop-box">
            <div class="shop-header">
                <span class="shop-title">🏪 LOJA MÁGICA</span>
                <span class="shop-money" id="shopMoney">💰 0</span>
            </div>
            <div id="shopList"></div>
            <button class="btn-close-records" onclick="closeShop()">VOLTAR</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/constants.js"></script>
    <script src="js/pet.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/minigame.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
